<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Dashboard</title>
    <link rel="stylesheet" href="../static/styles.css-backup1-2">
</head>
<body>
<header>
    <h1>News Dashboard</h1>
</header>
<main>
    {{ range $source, $items := .NewsData }}
    <section class="news-source">
        <h2>{{ $source }}</h2>
        <div class="card-container">
            {{ range $items }}
            <article class="news-card">
                <h3 class="news-title">{{ index .Fields "标题" }}</h3>
                <p class="news-summary">{{ index .Fields "摘要" }}</p>
                <a href="{{ index .Fields "链接" }}" class="read-more">Read More</a>
            </article>
            {{ end }}
        </div>
    </section>
    {{ end }}
</main>
<footer>
    <p>© 2024 News Dashboard</p>
</footer>
</body>
</html>
